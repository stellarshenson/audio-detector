<!--
  01-header.svg - README header banner for the audio-detector firmware (Arduino Nano)
  Shows: left title block (kicker, title, subtitle, meta); right band with one continuous signal -
  cyan audio waveform rising out of silence, orange dashed threshold with a crossing marker,
  mint NEC IR pulse train (IR START), lit power icon; state strip idle → audio start → audio on → standby.
  Intent: top-of-README header image.
  Theme: Stellars-Tech (cyan #0096d1 primary, orange #da8230 accent, mint for IR/on state).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid meet">
  <style>
    .fg-1 { fill: #1a5a6e; }
    .fg-3 { fill: #236a74; }
    .fg-4 { fill: #2b7680; }
    .accent-1 { fill: #005f7a; }
    .accent-2 { fill: #7a4a15; }
    .mint-t { fill: #0d6b4f; }
    .wave { stroke: #0096d1; }
    .thr { stroke: #da8230; }
    .ir { stroke: #1fa57f; }
    .dot-o { fill: #da8230; }
    .dot-bg { fill: #0096d1; }
    .bar { fill: #0096d1; }
    .ring-o { stroke: #da8230; }
    .icon-m { stroke: #1fa57f; }
    .glow-m { fill: #1fa57f; stroke: #1fa57f; }
    .pf-g { fill: #6b7280; } .ps-g { stroke: #6b7280; } .pa-g { fill: #6b7280; } .pt-g { fill: #4b5563; }
    .pf-o { fill: #da8230; } .ps-o { stroke: #da8230; } .pt-o { fill: #7a4a15; }
    .pf-m { fill: #1fa57f; } .ps-m { stroke: #1fa57f; } .pt-m { fill: #0d6b4f; }
    @media (prefers-color-scheme: dark) {
      .fg-1 { fill: #b8e4f0; }
      .fg-3 { fill: #8fd4e6; }
      .fg-4 { fill: #5aafc5; }
      .accent-1 { fill: #5cc8e0; }
      .accent-2 { fill: #d4a04a; }
      .mint-t { fill: #5fe0b4; }
      .wave { stroke: #3cbbe6; }
      .thr { stroke: #e8a05a; }
      .ir { stroke: #4fe0b0; }
      .dot-o { fill: #e8a05a; }
      .dot-bg { fill: #5cc8e0; }
      .bar { fill: #5cc8e0; }
      .ring-o { stroke: #e8a05a; }
      .icon-m { stroke: #4fe0b0; }
      .glow-m { fill: #4fe0b0; stroke: #4fe0b0; }
      .pf-g { fill: #9aa5b1; } .ps-g { stroke: #9aa5b1; } .pa-g { fill: #9aa5b1; } .pt-g { fill: #b6c0ca; }
      .pf-o { fill: #e8a05a; } .ps-o { stroke: #e8a05a; } .pt-o { fill: #f0b878; }
      .pf-m { fill: #4fe0b0; } .ps-m { stroke: #4fe0b0; } .pt-m { fill: #7ff0c8; }
    }
  </style>

  <g id="guide-grid" display="none">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="red" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="300" stroke="red" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="red" stroke-width="0.5"/>
  </g>

  <!-- === GRID REFERENCE ===
    viewBox 1200x300, margins 40
    Left text block x=40..470: kicker y=88, title y=140, subtitle y=170, meta y=200
    Right band x=500..1160: signal centre line y=130, threshold y=104, state strip y=238..262
    Accent bar y=292..300
  === -->
  <!-- TOPOLOGY:
    h-stack: text-block, signal-band
    v-stack: signal-band, state-strip
    h-spacing: pills (gap=60)
    contain: signal-band > waveform, threshold, ir-train, power-icon
  -->

  <g id="background">
    <defs>
      <pattern id="dots" x="500" y="50" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="0" cy="0" r="1" class="dot-bg" opacity="0.25"/>
      </pattern>
    </defs>
    <rect x="500" y="50" width="660" height="180" fill="url(#dots)"/>
    <rect x="0" y="290" width="1200" height="10" class="bar" opacity="0.6"/>
  </g>

  <g id="nodes">
    <circle cx="1132" cy="130" r="30" class="glow-m" fill-opacity="0.12" stroke-width="1" stroke-opacity="0.6"/>
    <g id="pill-idle">
      <rect x="500" y="240" width="120" height="20" rx="10" class="pf-g" fill-opacity="0.15"/>
      <rect x="500" y="240" width="120" height="20" rx="10" fill="none" class="ps-g" stroke-width="1"/>
    </g>
    <g id="pill-audio-start">
      <rect x="680" y="240" width="120" height="20" rx="10" class="pf-o" fill-opacity="0.15"/>
      <rect x="680" y="240" width="120" height="20" rx="10" fill="none" class="ps-o" stroke-width="1"/>
    </g>
    <g id="pill-audio-on">
      <rect x="860" y="240" width="120" height="20" rx="10" class="pf-m" fill-opacity="0.15"/>
      <rect x="860" y="240" width="120" height="20" rx="10" fill="none" class="ps-m" stroke-width="1"/>
    </g>
    <g id="pill-standby">
      <rect x="1040" y="240" width="120" height="20" rx="10" class="pf-g" fill-opacity="0.15"/>
      <rect x="1040" y="240" width="120" height="20" rx="10" fill="none" class="ps-g" stroke-width="1"/>
    </g>
  </g>

