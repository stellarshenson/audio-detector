  <g id="content">
    <g id="header-title-block">
      <text x="40" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2.5" class="accent-1">ARDUINO NANO  ·  FIRMWARE</text>
      <text x="40" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" class="fg-1">Audio Detector</text>
      <text x="40" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="16" class="fg-3">Turns your amplifier on when the music starts</text>
      <text x="40" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" class="fg-4">RCA level sense  ·  IR remote codes  ·  relay  ·  12V trigger</text>
    </g>
    <g id="labels">
      <text x="500" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1" class="accent-2">threshold</text>
      <text x="750" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1" class="mint-t">IR START</text>
    </g>
    <g id="pill-labels">
    <text x="560" y="254" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" class="pt-g">idle</text>
    <text x="740" y="254" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" class="pt-o">audio start</text>
    <text x="920" y="254" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" class="pt-m">audio on</text>
    <text x="1100" y="254" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" class="pt-g">standby</text>
    </g>
    <g id="icon-power" transform="translate(1108,106) scale(2)">
      <path d="M12 2v10" fill="none" class="icon-m" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M18.4 6.6a9 9 0 1 1-12.77.04" fill="none" class="icon-m" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </g>

  <g id="callouts">
