; Temporary firmware that only reads and writes the EEPROM over the serial
; console. host/src/audiodetector_host/eeprom_tool.py flashes it when the board
; runs a firmware without the eeprom commands, then restores the saved
; original image.

[env:nanoatmega328]
platform = atmelavr@5.3.0
board = nanoatmega328
framework = arduino
monitor_speed = 9600
